  const bm=await createImageBitmap(file),s=Math.min(1,1800/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  const b=await new Promise(r=>c.toBlob(r,'image/jpeg',.85));return{id:(await AS.upload(b)).id,t:'i'}
}

  modal(n?'New project':'Edit project',[field(f,'title','Title',d.title),field(f,'ctx','Context (where or why, e.g. Space Systems Lab)',d.ctx),field(f,'status','Status (optional, e.g. In progress)',d.status),field(f,'sum','One-line summary',d.sum),field(f,'pts','Key points, one per line',d.pts.join('\n'),5),field(f,'desc','Story / details (blank line = new paragraph)',d.desc,14),field(f,'tags','Tags, comma separated',d.tags.join(', ')),h('label',{},'Photos and videos (★ = card cover; videos up to 20 MB)',up),h('label',{},'Or paste a YouTube or Vimeo link (for bigger videos)',lk),h('div',{class:'bar'},btn('Add link',()=>{const m=embed(lk.value);if(!m)return alert('Paste a YouTube or Vimeo video link');d.media.push(m);lk.value='';draw()})),st,mm],()=>{
    const v=k=>f[k].value.trim(),L=k=>v(k).split('\n').map(s=>s.trim()).filter(Boolean);
    Object.assign(d,{title:v('title'),ctx:v('ctx'),status:v('status'),sum:v('sum'),desc:v('desc'),pts:L('pts'),tags:v('tags').split(',').map(s=>s.trim()).filter(Boolean)});
    if(!d.title)return alert('Add a title');
    if(n)S.projects.push(d);else S.projects[S.projects.findIndex(x=>x.id===d.id)]=d;
    commit();
  });
}
